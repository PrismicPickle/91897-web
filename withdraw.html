<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home Page</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="page">
        <!-- Left Vertical Menu Bar -->
        <nav class="left-menu">
            <a href="#" class="logo">
                <img src="images/Logo.png" alt="Company Logo">
            </a>
            <ul>
                <li><a href="INDEX.html">Home</a></li>
                <li class="dropdown">
                    <details>
                        <summary class="dropbtn">Cases <span class="caret">▾</span></summary>
                        <ul class="dropdown-content">
                            <li><a href="csgo.html">CSGO</a></li>
                            <li><a href="items.html">Items</a></li>
                            <li><a href="cash.html">Cash</a></li>
                        </ul>
                    </details>
                </li>
                <li><a href="inventory.html">Inventory</a></li>
                <li><a href="stats.html">Stats</a></li>
                <li><a href="wallet.html">Wallet</a></li>
                <li><a href="settings.html">Settings</a></li>
            </ul>
            <div class="account-panel">
                <a href="settings.html" class="account-link">
                    <span class="account-icon">👤</span>
                    <span>Account</span>
                </a>
            </div>
        </nav>

        <div class="main-area">
            <!-- Top Menu Bar -->
            <div class="top-menu">
                <li><a href="withdraw.html" class="active">Withdraw</a></li>
                <li><a href="deposit.html">Deposit</a></li>
                <div class="balance">Balance: <strong id="balance">$250.00</strong></div>
            </div>

            <!-- Main Content Area -->
            <div class="content">
                <h1>Withdraw Funds</h1>
                <p>Remove funds from your CaseLab balance.</p>
                <form id="withdrawForm" class="wallet-form">
                    <label for="withdrawAmount">Amount</label>
                    <div class="amount-input">
                        <span>$</span>
                        <input id="withdrawAmount" name="amount" type="number" min="0.01" step="0.01" placeholder="0.00" required>
                    </div>
                    <button type="submit" class="wallet-button">Withdraw</button>
                </form>
            </div>
        </div>
        <script src="script.js"></script>
    </div>
</body>
</html>
